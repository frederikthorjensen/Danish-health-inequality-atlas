name: Validate portfolio and app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: ty check app.py app_pages src scripts tests --python $(which python)
      - run: python -m scripts.check_deployment
