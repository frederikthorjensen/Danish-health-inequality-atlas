[theme]
base = "light"
primaryColor = "#147486"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FA"
textColor = "#142F43"
linkColor = "#147486"
borderColor = "#DEE6EB"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "5px"
font = "Arial"
baseFontSize = 15
headingFontSizes = ["34px", "26px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "25px"
paddingTop = "1.5rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#147486", "#294C68", "#526B7B", "#8DABB4"]
dataframeHeaderBackgroundColor = "#F7F9FA"

[theme.sidebar]
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#EFF3F5"
textColor = "#142F43"
primaryColor = "#147486"
borderColor = "#DEE6EB"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
